name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build
      run: docker build -t ${{ secrets.DOCKER_USER }}/devops-app .

    - name: Login
      run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

    - name: Push
      run: docker push ${{ secrets.DOCKER_USER }}/devops-app:latest