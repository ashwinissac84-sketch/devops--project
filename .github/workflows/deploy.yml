- name: Deploy to EC2
  uses: appleboy/ssh-action@v0.1.0
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ubuntu
    key: ${{ secrets.EC2_SSH_KEY }}
    script: |
      docker pull ${{ secrets.DOCKER_USER }}/devops-app:latest
      docker stop app || true
      docker rm app || true
      docker run -d -p 80:3000 --name app ${{ secrets.DOCKER_USER }}/devops-app:latest